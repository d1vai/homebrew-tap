name: Update d1v Formula

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update Formula from latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_d1v_formula.py

      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "Formula is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/d1v.rb
          git commit -m "d1v: update to $(ruby -ne 'puts $1 if /version \"([^\"]+)/' Formula/d1v.rb)"
          git push
